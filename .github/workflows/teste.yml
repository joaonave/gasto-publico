name: Teste integrado (simulação, não publica)
on:
  workflow_dispatch:
  push:
    paths: ["dados/teste_integrado.txt"]
permissions:
  contents: read
concurrency:
  group: teste
jobs:
  teste:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q tests
      - name: Rodada completa com dados reais, sem publicar
        env:
          BUFFER_KEY: ${{ secrets.BUFFER_KEY }}
          SIMULAR: "1"
        run: python -u -m robo.main
      - name: Relatório
        run: cat dados/diag/teste_integrado.md
      - uses: actions/upload-artifact@v4
        with:
          name: teste-integrado
          path: dados/diag/teste_integrado.md
