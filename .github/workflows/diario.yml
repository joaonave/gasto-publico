name: Robô diário – shows

on:
  schedule:
    - cron: "7 10 * * *"   # 07:07 em Brasília
  workflow_dispatch:
    inputs:
      data:
        description: "Data AAAAMMDD (vazio = ontem)"
        required: false

permissions:
  contents: write

jobs:
  rodar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Executar robô
        env:
          XAI_KEY: ${{ secrets.XAI_KEY }}
          DATA: ${{ github.event.inputs.data }}
          PUBLICAR: "false"
        run: python -m robo.main
      - name: Salvar posts e estado
        run: |
          git config user.name "robo-gasto-publico"
          git config user.email "robo@users.noreply.github.com"
          git add saida dados
          git diff --cached --quiet || git commit -m "Posts do dia"
          git push
