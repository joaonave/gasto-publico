name: Robô diário – gasto público

on:
  push:
    branches: [main]
    paths: ["robo/**", "requirements.txt", ".github/workflows/**"]   # código novo roda sozinho
  schedule:
    # o agendamento do GitHub atrasa ou falha: várias tentativas; só a primeira do dia roda (ultima_rodada)
    - cron: "7 10 * * *"   # 07:07
    - cron: "37 10 * * *"  # 07:37
    - cron: "17 11 * * *"  # 08:17
    - cron: "7 12 * * *"   # 09:07
    - cron: "7 14 * * *"   # 11:07
  workflow_dispatch:
    inputs:
      data:
        description: "Data AAAAMMDD (vazio = ontem)"
        required: false

permissions:
  contents: write
  issues: write

concurrency:
  group: robo
  cancel-in-progress: false

jobs:
  rodar:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # sempre o código mais novo (rodada na fila não usa código velho)
      - name: Bloquear re-run de código antigo
        if: github.run_attempt > 1
        run: |
          ATUAL=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$ATUAL" != "$GITHUB_SHA" ]; then
            echo "::error::Esta execução é de um código antigo ($GITHUB_SHA). Use 'Run workflow', não 'Re-run'."
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - name: Testes (erros que já aconteceram não podem voltar)
        run: python -m pytest -q tests
      - name: Executar robô
        env:
          XAI_KEY: ${{ secrets.XAI_KEY }}
          DATA: ${{ github.event.inputs.data }}
          BUFFER_KEY: ${{ secrets.BUFFER_KEY }}
          PORTAL_KEY: ${{ secrets.PORTAL_KEY }}
          PUBLICAR: "true"
        run: python -u -m robo.main
      - name: Salvar posts e estado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add saida dados cards
          git diff --cached --quiet || git commit -m "Posts do dia"
          git pull --rebase -X theirs origin main
          git push
      - name: Publicar no Buffer (com cards)
        env:
          BUFFER_KEY: ${{ secrets.BUFFER_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m robo.fila || true   # remove da fila posts de versões antigas
          python -m robo.publicar_pendentes
          git add saida dados
          git diff --cached --quiet || git commit -m "Resultado da publicação"
          git pull --rebase -X theirs origin main
          git push
      - name: Avisar se o dia ficou sem posts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          from datetime import datetime, timedelta, timezone
          agora = datetime.now(timezone(timedelta(hours=-3)))
          hoje = agora.strftime("%Y-%m-%d")
          if os.environ.get("GITHUB_EVENT_NAME") == "push" and agora.hour < 10:
              raise SystemExit(0)  # push de madrugada: a rodada do dia ainda vai acontecer
          e = json.load(open("dados/estado.json"))
          qtd = e.get("pub_qtd", 0) if e.get("pub_dia") == hoje else 0
          print("posts hoje:", qtd)
          if qtd == 0:
              url = f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
              subprocess.run(["gh", "issue", "create", "--title", f"Dia sem posts – {hoje}", "--body",
                              f"@joaonave a rodada terminou sem nenhum post agendado hoje. Relatório em saida/. Execução: {url}"])
          PY
      - name: Avisar falha
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create --title "Robô falhou – $(TZ=America/Sao_Paulo date +%F)" \
            --body "@joaonave a rodada falhou e nada foi publicado. Execução: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
