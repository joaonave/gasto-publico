name: Sonda de fontes
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/sonda.yml"]
permissions:
  contents: write
jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests
      - name: Sondar IBGE 6909 e IDHM PNUD
        run: |
          mkdir -p dados/sonda
          python - <<'PY'
          import json, requests
          ag = requests.get("https://servicodados.ibge.gov.br/api/v3/agregados", timeout=120).json()
          l = []
          for pq in ag:
              for t in pq.get("agregados", []):
                  n = t["nome"].lower()
                  if "esgot" in n or "desenvolvimento humano" in n:
                      l.append(f'{pq["id"]} | {pq["nome"]} | {t["id"]} | {t["nome"]}')
          open("dados/sonda/agregados.txt","w").write("\n".join(l))
          r = requests.get("https://servicodados.ibge.gov.br/api/v1/pesquisas", timeout=120)
          ps = r.json() if r.ok else []
          out = [f'{p.get("id")} | {p.get("nome")}' for p in ps]
          open("dados/sonda/pesquisas.txt","w").write(f"status {r.status_code}\n" + "\n".join(out))
          PY
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/sonda && git commit -m "Sonda de fontes" && git pull --rebase -X theirs origin main && git push
