name: Sonda de fontes
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/sonda.yml"]
permissions:
  contents: write
jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests
      - name: Sondar IBGE 6909 e IDHM PNUD
        run: |
          mkdir -p dados/sonda
          python - <<'PY'
          import json, requests
          B = "https://servicodados.ibge.gov.br/api"
          def salvar(nome, url):
              r = requests.get(url, timeout=120)
              open(f"dados/sonda/{nome}", "w").write(f"status {r.status_code}\n" + r.text[:60000])
          salvar("7555_meta.json", f"{B}/v3/agregados/7555/metadados")
          for pq in (37, 10111):
              salvar(f"pq{pq}_ind.json", f"{B}/v1/pesquisas/{pq}/indicadores")
              salvar(f"pq{pq}_bh.json", f"{B}/v1/pesquisas/{pq}/resultados/3106200")
          PY
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/sonda && git commit -m "Sonda de fontes" && git pull --rebase -X theirs origin main && git push
