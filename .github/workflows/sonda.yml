name: Sonda de fontes
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/sonda.yml", "robo/municipio.py"]
permissions:
  contents: write
jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests
      - name: Sondar IBGE 6909 e IDHM PNUD
        run: |
          mkdir -p dados/sonda
          python - <<'PY'
          from pathlib import Path
          from robo import municipio, pontos
          pop = pontos.Populacao(Path("dados/populacao.json"))
          m = municipio.Municipios(Path("/tmp/m.json"))
          out = []
          for nome, uf in (("Santo Antônio dos Lopes", "MA"), ("Belo Horizonte", "MG"), ("Natal", "RN")):
              f = {"municipio": nome, "uf": uf}
              cod = pop.cod(f)
              d = m.dados(cod)
              out.append(f"{cod} {d}\n{municipio.comentario(f, d, pop.por_cod.get(cod))}\n")
          open("dados/sonda/municipio_teste.txt", "w").write("\n".join(out))
          PY
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/sonda && git commit -m "Sonda de fontes" && git pull --rebase -X theirs origin main && git push
