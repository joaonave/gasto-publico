name: Fila do Buffer (diagnóstico)
on:
  push:
    paths: ["dados/apagar.txt"]
  workflow_dispatch:
    inputs:
      apagar: {description: 'trecho do texto a remover da fila', required: false, default: ''}
permissions:
  contents: write
jobs:
  fila:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests
      - env: {BUFFER_KEY: "${{ secrets.BUFFER_KEY }}"}
        run: |
          mkdir -p dados/diag
          T="${{ inputs.apagar }}"; [ -z "$T" ] && [ -f dados/apagar.txt ] && T="$(cat dados/apagar.txt)"; if [ -n "$T" ]; then python -m robo.fila --apagar "$T" > dados/diag/fila.txt 2>&1 || true; fi
          python -m robo.fila --listar >> dados/diag/fila.txt 2>&1 || true
          python - > dados/diag/raiox.txt 2>&1 <<'PY' || true
          from robo import emendas, emendas_portal, posts_emendas
          cad = emendas.parlamentares()
          planos = emendas_portal.para_planos(emendas_portal.baixar())
          alvo = open("dados/apagar.txt").read().strip().replace("raiox:", "")
          nomes = [n for n in cad if alvo in emendas.norm(n)] or sorted({x["parlamentar"] for x in planos if alvo in emendas.norm(x["parlamentar"])})
          print("nomes:", nomes)
          for n in nomes:
              rx = emendas.raio_x(n, planos, cad)
              if rx:
                  print(posts_emendas.post_raio_x(rx)["manchete_padrao"]); print(posts_emendas.post_raio_x(rx)["linha_fato"])
                  print("por ano:", {a: round(v / 1e6, 2) for a, v in rx["por_ano"].items()})
                  for t in rx["top"]: print(" ", t["destino"], t["uf"], round(t["valor"] / 1e6, 2))
          PY
          python -c "from pathlib import Path; from robo import municipio as m; M=m.Municipios(Path('/tmp/x.json')); [print(c, M.dados(c), m.comentario({'municipio':n,'uf':u}, M.dados(c)), sep='\n') for c,n,u in (('2110302','Santo Antônio dos Lopes','MA'),('3106200','Belo Horizonte','MG'))]" > dados/diag/municipio.txt 2>&1 || true
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/diag && git commit -m "Diagnóstico da fila" && git pull --rebase -X theirs origin main && git push
