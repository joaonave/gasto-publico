name: Fila do Buffer (diagnóstico)
on:
  push:
    paths: ["dados/apagar.txt"]
  workflow_dispatch:
    inputs:
      apagar: {description: 'trecho do texto a remover da fila', required: false, default: ''}
permissions:
  contents: write
jobs:
  fila:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests
      - env: {BUFFER_KEY: "${{ secrets.BUFFER_KEY }}"}
        run: |
          mkdir -p dados/diag
          T="${{ inputs.apagar }}"; [ -z "$T" ] && [ -f dados/apagar.txt ] && T="$(cat dados/apagar.txt)"; if [ -n "$T" ]; then python -m robo.fila --apagar "$T" > dados/diag/fila.txt 2>&1 || true; fi
          python -m robo.fila --listar >> dados/diag/fila.txt 2>&1 || true
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/diag && git commit -m "Diagnóstico da fila" && git pull --rebase -X theirs origin main && git push
