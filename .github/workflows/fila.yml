name: Fila do Buffer (listar, métricas, remover)
# Dispara ao alterar dados/apagar.txt:
#   "metricas <qualquer coisa>"  → lista a fila e as métricas dos posts enviados
#   "apagar:<trecho de 10+ letras>" → remove da fila o post agendado que contém o trecho
on:
  push:
    paths: ["dados/apagar.txt"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fila:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests
      - env: {BUFFER_KEY: "${{ secrets.BUFFER_KEY }}"}
        run: |
          mkdir -p dados/diag
          T="$(cat dados/apagar.txt 2>/dev/null)"
          case "$T" in apagar:??????????*) python -m robo.fila --apagar "${T#apagar:}" > dados/diag/fila.txt 2>&1 || true;; *) : > dados/diag/fila.txt;; esac
          python -m robo.fila --listar >> dados/diag/fila.txt 2>&1 || true
          python -m robo.fila --metricas > dados/diag/metricas.json 2> dados/diag/metricas_erro.txt || true
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/diag && git commit -m "Fila do Buffer" && git pull --rebase --autostash -X theirs origin main && git push
