name: Fila do Buffer (diagnóstico)
on:
  push:
    paths: ["dados/apagar.txt"]
  workflow_dispatch:
    inputs:
      apagar: {description: 'trecho do texto a remover da fila', required: false, default: ''}
permissions:
  contents: write
jobs:
  fila:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests
      - env: {BUFFER_KEY: "${{ secrets.BUFFER_KEY }}"}
        run: |
          mkdir -p dados/diag
          T="${{ inputs.apagar }}"; [ -z "$T" ] && [ -f dados/apagar.txt ] && T="$(cat dados/apagar.txt)"; if [ -n "$T" ]; then python -m robo.fila --apagar "$T" > dados/diag/fila.txt 2>&1 || true; fi
          python -m robo.fila --listar >> dados/diag/fila.txt 2>&1 || true
          { for u in https://diaad.s3.sa-east-1.amazonaws.com/sim/Mortalidade_Geral_2023.csv https://diaad.s3.sa-east-1.amazonaws.com/sim/Mortalidade_Geral_2024.csv https://diaad.s3.sa-east-1.amazonaws.com/sim/DO24OPEN.csv; do echo "== $u"; curl -sI -m 30 "$u" | head -5; done
            echo "== ftp CID10/DORES"; curl -s -m 60 ftp://ftp.datasus.gov.br/dissemin/publicos/SIM/CID10/DORES/ | tail -8
            echo "== ftp PRELIM/DORES"; curl -s -m 60 ftp://ftp.datasus.gov.br/dissemin/publicos/SIM/PRELIM/DORES/ | tail -8
          } > dados/diag/sim.txt 2>&1 || true
          python -c "from pathlib import Path; from robo import municipio as m; M=m.Municipios(Path('/tmp/x.json')); [print(c, M.dados(c), m.comentario({'municipio':n,'uf':u}, M.dados(c)), sep='\n') for c,n,u in (('2110302','Santo Antônio dos Lopes','MA'),('3106200','Belo Horizonte','MG'))]" > dados/diag/municipio.txt 2>&1 || true
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/diag && git commit -m "Diagnóstico da fila" && git pull --rebase -X theirs origin main && git push
