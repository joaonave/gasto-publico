name: Fila do Buffer (diagnóstico)
on:
  push:
    paths: ["dados/apagar.txt"]
  workflow_dispatch:
    inputs:
      apagar: {description: 'trecho do texto a remover da fila', required: false, default: ''}
permissions:
  contents: write
jobs:
  fila:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests
      - env: {BUFFER_KEY: "${{ secrets.BUFFER_KEY }}"}
        run: |
          mkdir -p dados/diag
          T="${{ inputs.apagar }}"; [ -z "$T" ] && [ -f dados/apagar.txt ] && T="$(cat dados/apagar.txt)"; case "$T" in apagar:??????????*) python -m robo.fila --apagar "${T#apagar:}" > dados/diag/fila.txt 2>&1 || true;; esac
          python -m robo.fila --listar >> dados/diag/fila.txt 2>&1 || true
          python - > dados/diag/df.txt 2>&1 <<'PY' || true
          from collections import defaultdict
          from robo import emendas, emendas_portal
          L = emendas_portal.baixar()
          cad = emendas.parlamentares()
          def uf_aut(n): return cad.get(emendas.norm(n), {}).get("uf", "")
          for alvo in ("FLAVIO BOLSONARO", "OTTO ALENCAR"):
              g = defaultdict(float)
              for r in L:
                  if emendas.norm(r["autor"]) == alvo and r["uf"] == "DF":
                      g[(r["favorecido"], r["natureza"], r["tipo_favorecido"], r["tipo"], r["ano"])] += r["pago"] or 0
              print("==", alvo)
              for k, v in sorted(g.items(), key=lambda kv: -kv[1])[:15]: print(f"  {v/1e6:8.2f} mi | {' | '.join(k)}")
          # quem mais manda para favorecidos no DF (parlamentares de fora do DF)
          tot, df = defaultdict(float), defaultdict(float)
          nat = defaultdict(float)
          for r in L:
              a = emendas.norm(r["autor"]); v = r["pago"] or 0
              tot[a] += v
              if r["uf"] == "DF" and uf_aut(r["autor"]) not in ("DF", ""):
                  df[a] += v; nat[(r["natureza"], r["tipo_favorecido"])] += v
          print("== ranking para o DF (autor de fora do DF)")
          for a, v in sorted(df.items(), key=lambda kv: -kv[1])[:20]:
              print(f"  {v/1e6:8.2f} mi ({100*v/tot[a]:.0f}% do total) | {a} {uf_aut(a)}")
          print("== natureza dos favorecidos no DF")
          for k, v in sorted(nat.items(), key=lambda kv: -kv[1])[:12]: print(f"  {v/1e6:9.2f} mi | {k}")
          PY
          python -c "from pathlib import Path; from robo import municipio as m; M=m.Municipios(Path('/tmp/x.json')); [print(c, M.dados(c), m.comentario({'municipio':n,'uf':u}, M.dados(c)), sep='\n') for c,n,u in (('2110302','Santo Antônio dos Lopes','MA'),('3106200','Belo Horizonte','MG'))]" > dados/diag/municipio.txt 2>&1 || true
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/diag && git commit -m "Diagnóstico da fila" && git pull --rebase -X theirs origin main && git push
