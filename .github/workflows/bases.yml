name: Bases anuais (homicídios DataSUS)
on:
  workflow_dispatch:
  push:
    paths: ["robo/homicidios.py"]
permissions:
  contents: write
jobs:
  bases:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pyreaddbc dbfread requests
      - run: python -m robo.homicidios
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/homicidios.json && git commit -m "Base de homicídios (SIM/DataSUS)" && git pull --rebase -X theirs origin main && git push
