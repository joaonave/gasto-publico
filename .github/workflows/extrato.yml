name: Extrato de emendas (sob demanda)
# Dispara ao alterar dados/extrato.txt com:  AUTOR;Cidade;UF  (ex.: REGINALDO LOPES;São João del-Rei;MG)
#   ou  busca:TERMO;AUTOR  (ex.: busca:BR-265;REGINALDO LOPES)
on:
  push:
    paths: ["dados/extrato.txt"]
permissions:
  contents: write
jobs:
  extrato:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: |
          mkdir -p dados/diag
          IFS=';' read -r A B C < dados/extrato.txt
          case "$A" in
            busca:*) python -m robo.busca_emenda "${A#busca:}" "$B" > dados/diag/extrato.md 2> dados/diag/extrato_erro.txt || true;;
            *) python -m robo.extrato "$A" "$B" "${C:-MG}" > dados/diag/extrato.md 2> dados/diag/extrato_erro.txt || true;;
          esac
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/diag && git commit -m "Extrato de emendas" && git pull --rebase --autostash -X theirs origin main && git push
